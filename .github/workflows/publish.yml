name: Publish to npm

on:
  release:
    types: [published]

jobs:
  ci:
    name: ubuntu-latest / Node 22
    # A desktop release is a dmg, not a new CLI. Without this guard, tagging the
    # app would publish the npm package too — with whatever version happened to
    # be in apps/cli at the time.
    if: ${{ !startsWith(github.event.release.tag_name, 'desktop-v') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build tools
        run: sudo apt-get install -y build-essential python3

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn turbo run build --filter='./packages/*'

      - name: Build CLI
        run: yarn workspace @evan-moon/memex build

      - name: Pack tarball
        run: npm pack
        working-directory: apps/cli

      - name: Install globally from tarball
        run: npm install -g apps/cli/evan-moon-memex-*.tgz

      - name: memex --version
        run: memex --version

      - name: memex list (empty DB)
        run: memex list

      - name: memex search (empty DB)
        run: memex search "test"

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install build tools
        run: sudo apt-get install -y build-essential python3

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn turbo run build --filter='./packages/*'

      - name: Build CLI
        run: yarn workspace @evan-moon/memex build

      - name: Publish
        run: npm publish --access public
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

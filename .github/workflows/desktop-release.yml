name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*.*.*'
  # Same build, no release. A pipeline whose first green run is also its first
  # public download has been debugged in front of an audience.
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn typecheck

      - name: Run unit tests
        run: yarn test

  build:
    name: Sign and notarize
    needs: test
    # macos-14 is arm64, which is what the app is built for. An x64 runner would
    # produce a dmg nobody asked for and rebuild the native modules for the
    # wrong architecture.
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build workspaces
        run: yarn build

      # electron-builder reads CSC_LINK as base64 OR as a path, and decides by
      # looking at it. A value with newlines in it — which is what `base64`
      # produces by default — fails the base64 read, gets tried as a path, and
      # dies as `apps/desktop not a file`, which names neither the secret nor
      # the problem. Say it here instead.
      - name: Check the certificate secret before it becomes a riddle
        env:
          CSC_LINK: ${{ secrets.CERTIFICATE_BASE64 }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "CERTIFICATE_BASE64 is empty. Re-set it with:"
            echo "  base64 -i cert.p12 | tr -d '\n' | gh secret set CERTIFICATE_BASE64 --repo evan-moon/memex"
            exit 1
          fi
          if [ "$(printf '%s' "$CSC_LINK" | wc -l | tr -d ' ')" != "0" ]; then
            echo "CERTIFICATE_BASE64 contains newlines; electron-builder needs one line. Re-set it with:"
            echo "  base64 -i cert.p12 | tr -d '\n' | gh secret set CERTIFICATE_BASE64 --repo evan-moon/memex"
            exit 1
          fi
          printf '%s' "$CSC_LINK" | base64 -d > /tmp/cert-probe.p12 2>/dev/null || {
            echo "CERTIFICATE_BASE64 is not valid base64."; exit 1; }
          echo "certificate decodes to $(wc -c < /tmp/cert-probe.p12 | tr -d ' ') bytes"
          rm -f /tmp/cert-probe.p12

      # `yarn install` fetches better-sqlite3's prebuilt for Node's ABI, and the
      # app runs on Electron's. Packaging without the Electron build produces a
      # signed, notarized dmg that dies on launch with ERR_DLOPEN_FAILED — every
      # check after this one passes on it, because none of them start the app.
      - name: Build the native module for both runtimes
        run: yarn native

      - name: Package
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: yarn electron-builder --mac

      # Gatekeeper is the only judge that matters here: a dmg that builds and
      # signs but was never notarized installs with a warning nobody should be
      # asked to click through. Failing the release is better than shipping it.
      - name: Verify the notarized app
        working-directory: apps/desktop
        run: |
          APP="release/mac-arm64/memex.app"
          codesign --verify --deep --strict --verbose=1 "$APP"
          spctl -a -vv "$APP"

      # Gatekeeper says the app is trustworthy, not that it runs. Every check
      # before this one passed on a build whose better-sqlite3 was compiled for
      # Node's ABI, which the app only discovers at launch — by dying. Loading
      # the native module under Electron's own runtime needs no display, so it
      # is the one check a headless runner can make on behalf of a reader who
      # would otherwise be the first to find out.
      # A packaged app whose renderer never got copied opens a window, serves
      # nothing, and passes every other check — the same shape as the native
      # module problem: the failure only exists at launch, and nothing before
      # this looks for it.
      - name: Verify the app ships the screen it opens
        working-directory: apps/desktop
        run: |
          PAGE="release/mac-arm64/memex.app/Contents/Resources/app/dist/renderer/index.html"
          if [ ! -f "$PAGE" ]; then
            echo "The packaged app has no renderer at $PAGE." >&2
            echo "apps/desktop's build copies apps/ui/dist there; it did not run, or the UI was never built." >&2
            exit 1
          fi

      - name: Verify the app can load its native modules
        working-directory: apps/desktop
        run: |
          APP="release/mac-arm64/memex.app"
          RELEASE="$APP/Contents/Resources/app/node_modules/better-sqlite3/build/Release"
          NATIVE="$RELEASE/better_sqlite3-electron.node"
          if [ ! -f "$NATIVE" ]; then
            echo "The packaged app has no Electron build of better-sqlite3 at $NATIVE." >&2
            echo "'yarn native' writes it; the packaging step ran without it." >&2
            exit 1
          fi
          if ! ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/memex" \
               -e "process.dlopen({ exports: {} }, process.argv[1])" "$NATIVE" 2>/dev/null; then
            echo "The packaged better-sqlite3 does not load under Electron." >&2
            echo "It was built for Node's ABI; run 'yarn native' before packaging." >&2
            exit 1
          fi
          # The Node build has no reader inside the app and is excluded from it.
          # Shipping it would mean the filter stopped working, and the app would
          # be carrying two megabytes it can never load.
          if [ -f "$RELEASE/better_sqlite3-node.node" ]; then
            echo "The packaged app ships the Node build it cannot load." >&2
            exit 1
          fi

      - name: Keep the dmg where only this repo can see it
        uses: actions/upload-artifact@v4
        with:
          name: memex-arm64-dmg
          path: apps/desktop/release/*.dmg
          retention-days: 7

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#desktop-v}"
          BUILT=$(ls release/*.dmg | head -1)
          VERSIONED="release/memex-${VERSION}-arm64.dmg"
          [ "$BUILT" = "$VERSIONED" ] || mv "$BUILT" "$VERSIONED"
          gh release create "$TAG" \
            --title "memex desktop ${VERSION}" \
            --generate-notes \
            "$VERSIONED"

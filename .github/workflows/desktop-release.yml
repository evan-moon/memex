name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*.*.*'
  # Same build, no release. A pipeline whose first green run is also its first
  # public download has been debugged in front of an audience.
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn typecheck

      - name: Run unit tests
        run: yarn test

  build:
    name: Sign and notarize
    needs: test
    # macos-14 is arm64, which is what the app is built for. An x64 runner would
    # produce a dmg nobody asked for and rebuild the native modules for the
    # wrong architecture.
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build workspaces
        run: yarn build

      # electron-builder reads CSC_LINK as base64 OR as a path, and decides by
      # looking at it. A value with newlines in it — which is what `base64`
      # produces by default — fails the base64 read, gets tried as a path, and
      # dies as `apps/desktop not a file`, which names neither the secret nor
      # the problem. Say it here instead.
      - name: Check the certificate secret before it becomes a riddle
        env:
          CSC_LINK: ${{ secrets.CERTIFICATE_BASE64 }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "CERTIFICATE_BASE64 is empty. Re-set it with:"
            echo "  base64 -i cert.p12 | tr -d '\n' | gh secret set CERTIFICATE_BASE64 --repo evan-moon/memex"
            exit 1
          fi
          if [ "$(printf '%s' "$CSC_LINK" | wc -l | tr -d ' ')" != "0" ]; then
            echo "CERTIFICATE_BASE64 contains newlines; electron-builder needs one line. Re-set it with:"
            echo "  base64 -i cert.p12 | tr -d '\n' | gh secret set CERTIFICATE_BASE64 --repo evan-moon/memex"
            exit 1
          fi
          printf '%s' "$CSC_LINK" | base64 -d > /tmp/cert-probe.p12 2>/dev/null || {
            echo "CERTIFICATE_BASE64 is not valid base64."; exit 1; }
          echo "certificate decodes to $(wc -c < /tmp/cert-probe.p12 | tr -d ' ') bytes"
          rm -f /tmp/cert-probe.p12

      - name: Package
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: yarn electron-builder --mac

      # Gatekeeper is the only judge that matters here: a dmg that builds and
      # signs but was never notarized installs with a warning nobody should be
      # asked to click through. Failing the release is better than shipping it.
      - name: Verify the notarized app
        working-directory: apps/desktop
        run: |
          APP="release/mac-arm64/memex.app"
          codesign --verify --deep --strict --verbose=1 "$APP"
          spctl -a -vv "$APP"

      - name: Keep the dmg where only this repo can see it
        uses: actions/upload-artifact@v4
        with:
          name: memex-arm64-dmg
          path: apps/desktop/release/*.dmg
          retention-days: 7

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#desktop-v}"
          BUILT=$(ls release/*.dmg | head -1)
          VERSIONED="release/memex-${VERSION}-arm64.dmg"
          [ "$BUILT" = "$VERSIONED" ] || mv "$BUILT" "$VERSIONED"
          gh release create "$TAG" \
            --title "memex desktop ${VERSION}" \
            --generate-notes \
            "$VERSIONED"
